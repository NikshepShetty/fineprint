[project]
name = "fineprint"
version = "0.1.0"
requires-python = ">=3.12.2"
dependencies = [
    "chromadb>=1.5.9",
    "faker>=40.36.0",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.5.4",
    "langchain-core>=1.5.3",
    "langgraph>=1.2.10",
    "mlflow>=3.15.1",
    "pandas>=2.3.3",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "pyspark>=4.2.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.7.0",
    "shap>=0.52.0",
    "uvicorn[standard]>=0.51.0",
    "xgboost>=3.4.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

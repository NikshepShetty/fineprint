<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FinePrint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
<script src="https://cdn.tailwindcss.com?plugins=typography"></script>
<script>
  tailwind.config = { darkMode: 'class' };
</script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .font-display { font-family: 'Space Grotesk', sans-serif; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
  .dark ::-webkit-scrollbar-thumb { background: #475569; }
  *, *::before, *::after {
    transition: background-color 250ms ease, border-color 250ms ease, color 250ms ease, fill 250ms ease;
  }
  @keyframes spin-in {
    from { transform: rotate(-90deg) scale(0.6); opacity: 0; }
    to { transform: rotate(0) scale(1); opacity: 1; }
  }
</style>
</head>
<body class="bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 transition-colors">
<div id="root"></div>

<script type="text/plain" id="app-source">
const { useState, useEffect, useRef } = React;

function renderMarkdown(text) {
  const raw = marked.parse(text, { breaks: true });
  return { __html: DOMPurify.sanitize(raw) };
}

function riskColor(score) {
  if (score >= 40) return "bg-rose-500 text-white";
  if (score >= 20) return "bg-amber-400 text-amber-950";
  return "bg-emerald-500 text-white";
}

function IconButton({ onClick, label, children }) {
  return (
    <button
      onClick={onClick}
      title={label}
      aria-label={label}
      className="w-8 h-8 flex items-center justify-center rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
    >
      {children}
    </button>
  );
}

function SunIcon() {
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-[18px] h-[18px]">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
    </svg>
  );
}

function MoonIcon() {
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-[18px] h-[18px]">
      <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79Z" />
    </svg>
  );
}

function DocumentDetail({ doc, onClose }) {
  if (!doc) return null;
  return (
    <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center p-4 z-20" onClick={onClose}>
      <div className="bg-white dark:bg-slate-800 max-w-lg w-full rounded-2xl shadow-2xl p-6" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-start justify-between mb-3">
          <h2 className="font-display font-semibold text-xl">{doc.counterparty_name}</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-700 dark:hover:text-slate-200">✕</button>
        </div>
        <div className="flex items-center gap-2 mb-4">
          <span className="text-sm text-slate-500 dark:text-slate-400">{doc.contract_id}</span>
          <span className={`text-xs font-semibold px-2.5 py-0.5 rounded-full ${riskColor(doc.risk_score)}`}>
            risk {doc.risk_score}
          </span>
        </div>
        <p className="text-sm leading-relaxed whitespace-pre-line text-slate-700 dark:text-slate-300">{doc.contract_text}</p>
        {doc.clauses_present && doc.clauses_present.length > 0 && (
          <div className="mt-4 pt-4 border-t border-slate-200 dark:border-slate-700">
            <p className="text-xs uppercase tracking-wide text-slate-400 mb-2">Flagged clauses</p>
            <div className="flex flex-wrap gap-1.5">
              {doc.clauses_present.map((c) => (
                <span key={c} className="text-xs bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 px-2.5 py-1 rounded-full">{c.replace(/_/g, " ")}</span>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function DocumentsPanel({ documents, loading, error, onSelect }) {
  return (
    <div className="w-72 shrink-0 border-l border-slate-200 dark:border-slate-800 flex flex-col h-full">
      <div className="px-4 py-4 border-b border-slate-200 dark:border-slate-800">
        <h2 className="font-display font-semibold text-lg">Contracts</h2>
        <p className="text-xs text-slate-400 mt-0.5">{documents.length} on file</p>
      </div>
      <div className="overflow-y-auto flex-1">
        {loading && <p className="p-4 text-sm text-slate-400">Loading…</p>}
        {error && <p className="p-4 text-sm text-rose-600 dark:text-rose-400">{error}</p>}
        {documents.map((doc) => (
          <button
            key={doc.contract_id}
            onClick={() => onSelect(doc.contract_id)}
            className="w-full text-left px-4 py-3 border-b border-slate-200 dark:border-slate-800/60 hover:bg-indigo-50/60 dark:hover:bg-indigo-500/10 transition-colors"
          >
            <div className="flex items-center justify-between gap-2">
              <span className="text-sm font-medium truncate">{doc.counterparty_name}</span>
              <span className={`text-xs font-semibold px-2 py-0.5 rounded-full shrink-0 ${riskColor(doc.risk_score)}`}>
                {doc.risk_score}
              </span>
            </div>
            <span className="text-xs text-slate-400">{doc.contract_id}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

function ChatMessage({ role, text }) {
  const isUser = role === "user";
  return (
    <div className={`flex ${isUser ? "justify-end" : "justify-start"}`}>
      <div
        className={`max-w-[75%] rounded-2xl px-4 py-2.5 text-sm leading-relaxed ${
          isUser
            ? "bg-indigo-600 dark:bg-indigo-500 text-white"
            : "bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-800 dark:text-slate-100 prose prose-sm dark:prose-invert max-w-none prose-p:my-2 prose-headings:font-display prose-headings:mt-3 prose-headings:mb-1.5"
        }`}
      >
        {isUser ? text : <div dangerouslySetInnerHTML={renderMarkdown(text)} />}
      </div>
    </div>
  );
}

function ChatPanel({ sidebarOpen, onToggleSidebar, darkMode, onToggleDark }) {
  const [messages, setMessages] = useState([
    { role: "welcome", text: "Ask me about a contract or invoice, e.g. \"Why might contract CTR-0000 be considered risky?\"" },
  ]);
  const [input, setInput] = useState("");
  const [sending, setSending] = useState(false);
  const [error, setError] = useState(null);
  const bottomRef = useRef(null);

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [messages]);

  async function sendMessage() {
    const question = input.trim();
    if (!question || sending) return;

    setMessages((m) => [...m, { role: "user", text: question }]);
    setInput("");
    setSending(true);
    setError(null);

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          question,
          history: messages
            .filter((message) => message.role === "user" || message.role === "assistant")
            .slice(-20)
            .map(({ role, text }) => ({ role, content: text })),
        }),
      });
      const data = await res.json();
      if (!res.ok) {
        throw new Error(
          res.status === 429
            ? "Too many requests. Please try again later."
            : data.detail || "Something went wrong."
        );
      }
      setMessages((m) => [...m, { role: "assistant", text: data.answer }]);
    } catch (e) {
      setError(e.message);
    } finally {
      setSending(false);
    }
  }

  function handleKeyDown(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  return (
    <div className="flex-1 flex flex-col h-full min-w-0">
      <div className="px-6 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
        <div className="flex items-center gap-2.5">
          <div className="w-8 h-8 rounded-lg bg-indigo-600 dark:bg-indigo-500 flex items-center justify-center">
            <span className="text-white font-display font-bold text-sm">F</span>
          </div>
          <div>
            <h1 className="font-display font-bold text-xl leading-tight">FinePrint</h1>
            <p className="text-xs text-slate-400">Ask about contract and invoice risk</p>
          </div>
        </div>
        <div className="flex items-center gap-1">
          <IconButton onClick={onToggleDark} label={darkMode ? "Switch to light mode" : "Switch to dark mode"}>
            <span key={darkMode ? "sun" : "moon"} className="inline-block animate-[spin-in_300ms_ease-out]">
              {darkMode ? <SunIcon /> : <MoonIcon />}
            </span>
          </IconButton>
          <IconButton onClick={onToggleSidebar} label={sidebarOpen ? "Hide contracts" : "Show contracts"}>
            {sidebarOpen ? "⟩⟩" : "⟨⟨"}
          </IconButton>
        </div>
      </div>

      <div className="flex-1 overflow-y-auto px-6 py-5 space-y-3 bg-slate-50/40 dark:bg-slate-800/20">
        {messages.map((m, i) => (
          <ChatMessage key={i} role={m.role} text={m.text} />
        ))}
        {sending && (
          <ChatMessage role="assistant" text="Thinking…" />
        )}
        {error && (
          <div className="text-sm text-rose-700 dark:text-rose-300 bg-rose-50 dark:bg-rose-500/10 border border-rose-100 dark:border-rose-500/20 rounded-xl px-4 py-2.5">
            {error}
          </div>
        )}
        <div ref={bottomRef} />
      </div>

      <div className="px-6 py-4 border-t border-slate-200 dark:border-slate-800 flex gap-2 bg-white dark:bg-slate-900">
        <textarea
          value={input}
          onChange={(e) => setInput(e.target.value)}
          onKeyDown={handleKeyDown}
          placeholder="Ask a question..."
          rows={1}
          className="flex-1 resize-none rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-400"
        />
        <button
          onClick={sendMessage}
          disabled={sending || !input.trim()}
          className="bg-indigo-600 dark:bg-indigo-500 text-white text-sm font-medium px-4 py-2.5 rounded-xl disabled:opacity-30 hover:bg-indigo-700 dark:hover:bg-indigo-600 transition-colors"
        >
          Send
        </button>
      </div>
    </div>
  );
}

function App() {
  const [documents, setDocuments] = useState([]);
  const [docsLoading, setDocsLoading] = useState(true);
  const [docsError, setDocsError] = useState(null);
  const [selectedDoc, setSelectedDoc] = useState(null);
  const [sidebarOpen, setSidebarOpen] = useState(true);
  const [darkMode, setDarkMode] = useState(
    window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
  );

  useEffect(() => {
    document.documentElement.classList.toggle("dark", darkMode);
  }, [darkMode]);

  useEffect(() => {
    fetch("/documents")
      .then((res) => {
        if (!res.ok) throw new Error("Could not load documents.");
        return res.json();
      })
      .then(setDocuments)
      .catch((e) => setDocsError(e.message))
      .finally(() => setDocsLoading(false));
  }, []);

  async function handleSelect(contractId) {
    try {
      const res = await fetch(`/documents/${contractId}`);
      if (!res.ok) throw new Error("Could not load that contract.");
      setSelectedDoc(await res.json());
    } catch (e) {
      setDocsError(e.message);
    }
  }

  return (
    <div className="h-screen flex">
      <ChatPanel
        sidebarOpen={sidebarOpen}
        onToggleSidebar={() => setSidebarOpen((v) => !v)}
        darkMode={darkMode}
        onToggleDark={() => setDarkMode((v) => !v)}
      />
      {sidebarOpen && (
        <DocumentsPanel
          documents={documents}
          loading={docsLoading}
          error={docsError}
          onSelect={handleSelect}
        />
      )}
      <DocumentDetail doc={selectedDoc} onClose={() => setSelectedDoc(null)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
  const source = document.getElementById("app-source").textContent;
  const compiled = Babel.transform(source, {
    presets: [["react", { runtime: "classic" }]],
  }).code;
  const runnable = document.createElement("script");
  runnable.textContent = compiled;
  document.body.appendChild(runnable);
</script>
</body>
</html>
